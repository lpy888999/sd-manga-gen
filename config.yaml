# ============================================================
#  SDXL Manga Generation Pipeline — Configuration
# ============================================================

# --- LLM Settings ---
llm:
  model_name: "qwen3:8b"     # Ollama model for text tasks
  temperature: 0.7

# --- Stable Diffusion Settings ---
sd:
  # Base model — accepts a HuggingFace model ID or a local path
  model_path: "Lykon/dreamshaper-xl-1-0"
  # model_path: "/path/to/local/sdxl-model"

  # LoRA weights — just drop .safetensors files into these directories
  # The pipeline will auto-load every .safetensors found in each folder.
  lora:
    # Character LoRA — keeps the protagonist consistent across panels
    character:
      dir: "loras/character"        # folder containing <name>.safetensors
      weight: 0.8                   # adapter strength

    # Style LoRA — locks the global art style (manga / comic / etc.)
    style:
      dir: "loras/style"
      weight: 0.6

    # (optional) extra trigger words injected into every prompt
    trigger_words: []               # e.g. ["manga style", "thick lineart"]

  # IP-Adapter — keeps character consistent based on reference image
  ip_adapter:
    enable: true
    # "base" for standard IP-Adapter, "faceid_plus_v2" for IP-Adapter FaceID Plus V2
    type: "base"

    # Settings for type: "base"
    model_id: "h94/IP-Adapter"
    subfolder: "sdxl_models"
    weight_name: "ip-adapter-plus-face_sdxl_vit-h.bin"

    # Settings for type: "faceid_plus_v2"
    faceid_model_id: "models/ip-adapter/ip-adapter-faceid-plusv2_sdxl.bin"
    faceid_lora_name: "models/ip-adapter/ip-adapter-faceid-plusv2_sdxl_lora.safetensors"

    # Global scale (used in single-stage mode or Stage 2 override below)
    scale: 0.6

    # ── Two-Stage Generation ──────────────────────────────────────────
    # Only activates when BOTH LoRA and IP-Adapter are enabled.
    # Stage 1: pure LoRA Text2Img for clean composition/layout
    # Stage 2: ControlNet Canny Img2Img + low IP-Adapter to pull character
    #          features toward the reference image without breaking the pose.
    two_stage:
      enabled: true

      # Edge detector used for Stage 2 geometry guidance. choices: ["canny", "hed"]
      edge_detector: "hed"

      # Img2Img denoising strength for Stage 2. (Recommended: 0.35 - 0.50)
      stage2_strength: 0.8

      # IP-Adapter scale used ONLY in Stage 2. (Recommended: 0.35 - 0.55)
      stage2_ip_scale: 0.6

      # ControlNet model for Canny edge guidance
      controlnet_id: "/vol/bitbucket/jl10525/hf_cache/controlnet-canny-sdxl"

      # How strongly the Canny edge map guides Stage 2 generation. (Recommended: 0.25 - 0.45)
      # Structural constraints (Canny) must be weaker than identity constraints (IP-Adapter)
      controlnet_scale: 0.3

      # Canny edge detection thresholds
      canny_low_threshold: 75
      canny_high_threshold: 175

    # Stage 3 Face Restoration (can be enabled independently of two_stage)
    face_restoration:
      enabled: true
      upscale_factor: 1.0     # Final face upscale multiplier
      strength: 0.6           # Inpainting/blending strength

  # Generation parameters
  guidance_scale: 6.0
  num_inference_steps: 35
  seed: null                        # null = random each run

# --- Panel / Layout Settings ---
panels:
  auto_threshold: 30        # word-count threshold: ≤30 → 4 panels, >30 → 6
  default_count: 4           # fallback when auto-detection is disabled

layout:
  # Per-panel resolution (width × height) fed to SD
  panel_size:
    width: 1024
    height: 768
  # Comic page assembly
  border_width: 6            # px, thick black panel borders
  gutter: 12                 # px, spacing between panels
  background_color: "white"

# --- Prompt Engineering ---
prompt:
  # Concise quality tags to save CLIP token space (SDXL has a 77 token limit)
  quality_suffix: "masterpiece"
  # Negative prompt shared across all panels
  negative_prompt: "low quality, blurry, distorted face, extra fingers, bad anatomy, watermark, text, signature"



# --- TTS / Audio Settings ---
tts:
  enabled: true

  # LLM for script extraction (can differ from main llm.model_name)
  # Set to null or omit to reuse the main llm.model_name
  script_model_name: qwen3:8b
  script_temperature: 0.5

  # Edge TTS model identifier
  model: "edge-tts"

  # Voice assignment pool (Microsoft Neural voices)
  # High-quality, emotive, zero-VRAM cloud voices.
  voices:
    narrator: "en-US-ChristopherNeural"
    male_pool: ["en-US-GuyNeural", "en-US-EricNeural", "en-GB-RyanNeural", "en-AU-WilliamNeural"]
    female_pool: ["en-US-AriaNeural", "en-US-JennyNeural", "en-GB-SoniaNeural", "en-AU-NatashaNeural"]

  output_dir: "output/audio"
